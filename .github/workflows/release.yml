name: Release

# Publishes @gnldev packages to npm with provenance (GitHub OIDC). This is deliberately
# separate from ci.yml: it never runs on a plain push to master/main, only on an
# explicit version tag or a manual dispatch — publishing is a user-triggered action.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (pnpm -r publish --dry-run) — no packages are actually published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm provenance: --provenance only attests from CI via OIDC

# Avoid two release runs racing on the same set of npm publishes (e.g. a tag push and a
# manual dispatch overlapping).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: build · typecheck · test · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test

      # Every publishable package carries the same version (single-version policy), so there are
      # three ways a release can be wrong and this step checks all three. The earlier version only
      # rejected 0.0.0, which stopped catching anything the moment the packages were bumped to
      # 0.1.0 — a guard that passes unconditionally is worse than none, because it reads as
      # verification.
      - name: Version guard
        run: |
          set -euo pipefail
          declare -A seen=()
          bad=0
          for pkg in packages/*/package.json; do
            [ "$(jq -r '.private // false' "$pkg")" = "true" ] && continue
            name=$(jq -r '.name' "$pkg"); version=$(jq -r '.version' "$pkg")
            if [ "$version" = "0.0.0" ]; then
              echo "::error file=$pkg::$name is still at 0.0.0"; bad=1
            fi
            seen["$version"]+="$name "
          done

          # (1) one version across the workspace — a half-finished bump publishes a set of packages
          # whose workspace:^ ranges resolve to versions that were never released together.
          if [ "${#seen[@]}" -gt 1 ]; then
            echo "::error::publishable packages disagree on the version:"
            for v in "${!seen[@]}"; do echo "    $v — ${seen[$v]}"; done
            bad=1
          fi

          # (2) on a tag push, the tag is the claim being made — v0.2.0 against packages still at
          # 0.1.0 would publish 0.1.0 again and fail on npm as "cannot publish over existing".
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            want="${GITHUB_REF_NAME#v}"
            have="$(printf '%s\n' "${!seen[@]}" | head -1)"
            if [ "${#seen[@]}" -eq 1 ] && [ "$want" != "$have" ]; then
              echo "::error::tag $GITHUB_REF_NAME asks for $want but the workspace is at $have"
              bad=1
            fi
          fi

          [ "$bad" -eq 0 ] || { echo "Refusing to publish."; exit 1; }
          echo "Version guard passed: ${#seen[@]} version across the workspace ($(printf '%s' "${!seen[@]}"))."

      # pnpm -r publish walks the workspace in topological order on its own (peers such as
      # @gnldev/tool-schema and @gnldev/durable publish before their dependents), so no manual
      # --filter ordering is needed here.
      #
      # A package marked "private": true is skipped by `-r publish` automatically, so no --filter
      # is needed to hold one back. Flipping that field is what makes a package publishable; the
      # version guard above then applies to it like any other.
      #
      # --no-git-checks is required because the tag ref is checked out detached (not on a
      # branch), which pnpm's default git-status checks would otherwise reject.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: pnpm -r publish --access public --provenance --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
