name: CLA

# Enforces the CLA checkbox in the pull request template. No third-party service, no OAuth app, no
# token with write access — this reads the PR body that GitHub already hands the workflow and fails
# the check if the box is unticked. The signed record is the PR itself: GitHub keeps the body, the
# author, and the timestamp for the life of the repository.

# `pull_request_target` on purpose, and this is the security-relevant choice. A `pull_request`
# workflow is read from the PULL REQUEST's merge commit, so a fork can rewrite this very file inside
# its own pull request — replace the check with `exit 0` and the CLA gate reports green. With
# `pull_request_target` the definition comes from the base branch, which a contributor cannot touch.
#
# The usual danger of `pull_request_target` is the "pwn request": it runs with the base repository's
# token, so checking out and executing contributor code hands that token away. This job never checks
# out anything and never runs contributor code — it reads the event payload GitHub already gave it.
# That is exactly the case `pull_request_target` is safe for, and the case where it is necessary.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  cla:
    name: CLA accepted
    runs-on: ubuntu-latest
    steps:
      - name: Check the CLA box in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          # The version in force. Raise this in the same commit that adds a new CLA version, so a
          # contributor who accepted the old text is asked again rather than passing silently.
          CLA_VERSION: '1.1'
        run: |
          # Bots submit no original authorship, so there is nothing for them to license. Everyone
          # else ticks the box, the maintainer included: one rule with no exception is easier to
          # trust than one with a carve-out, it stays correct if the project is ever transferred to
          # a company (the "owner" changes, the rule does not), and it means the check can be
          # verified from any account instead of only from a second one.
          # Only dependency bots are exempt, by name. "Is a bot" is no longer a safe proxy for
          # "submits no original authorship" — agentic coding bots open pull requests carrying
          # substantial code, and a blanket type check would let all of it in unaccepted.
          #
          # The list stays SHORT on purpose, and is not the mechanism for coding agents. Enumerating
          # which tools write code is a list that goes stale faster than anyone updates it, and the
          # question it tries to answer is the wrong one: what matters is not which tool typed the
          # diff but which PERSON stands behind it. A machine account cannot make Section 4's
          # representations — the work is mine to give, no third-party claim — so when one opens a
          # code PR, a human says so in a comment and that is what gets merged. CLA.md
          # ("Machine accounts, and why a person still signs") is the rule; this check is only its
          # cheapest half.
          case "$PR_AUTHOR" in
            dependabot\[bot\]|renovate\[bot\]|github-actions\[bot\])
              echo "::notice::$PR_AUTHOR is a dependency bot — nothing to license, skipping."
              exit 0
              ;;
          esac

          # The canonical sentence AND the version in force, not merely a ticked line mentioning
          # "CLA". A loose match accepted things it should not: "- [x] not sure the CLA applies"
          # passed, and after a v1.1 the stale v1.0 line would keep passing while the contributor
          # had never seen the new terms.
          if printf '%s' "$PR_BODY" | grep -qE "^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*I have read and agree to the \[CLA, v${CLA_VERSION}\]"; then
            echo "CLA accepted by $PR_AUTHOR."
            exit 0
          fi

          echo "::error::The CLA box in the pull request description is not ticked."
          cat <<'MSG'

          This project requires a Contributor License Agreement before a change can be merged.

          To accept it: edit this pull request's description and tick

              - [x] I have read and agree to the [CLA, v1.1](https://github.com/Karaca7/gnl-framework/blob/main/CLA.md).

          Read it first — it grants the maintainer the right to relicense the contribution,
          including under terms that are not open source. It is a one-time step per account, but
          the box is checked on every pull request so the acceptance is recorded with the change.

          If the box is missing entirely, your description was not created from the pull request
          template; copy the line above into it.

          MSG
          exit 1
