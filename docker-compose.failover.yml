# Postgres primary + SYNCHRONOUS replica for real FAILOVER verification.
# Live-tests the deployment prerequisite from the README ("synchronous_commit=on + standby"):
#   docker compose -f docker-compose.failover.yml up -d
#   GNL_FAILOVER=1 npx vitest run packages/durable/test/failover-real.test.ts
#   docker compose -f docker-compose.failover.yml down -v
# Test flow: acked CAS writes to primary → KILL the primary (SIGKILL) → PROMOTE the replica →
# on the new primary, does (a) ALL of the acked writes survive, and (b) does CAS atomicity hold?
# Official postgres image + streaming replication via pg_basebackup; synchronous mode via primary flags.
# Ports: 55440 (primary), 55441 (replica). WARNING: trust auth — LOCAL TESTING ONLY.
services:
  pg-primary:
    image: postgres:15-alpine
    container_name: gnl-failover-primary
    environment:
      POSTGRES_USER: gnl
      POSTGRES_PASSWORD: gnl
      POSTGRES_DB: gnl
    # Synchronous settings are applied via the init script (see scripts/failover-init.sh), NOT via
    # command line: if passed via command, the entrypoint's temporary init server would also wait
    # synchronously → CREATE DATABASE deadlock.
    volumes:
      - ./scripts/failover-init.sh:/docker-entrypoint-initdb.d/zz-replication.sh:ro
    ports:
      - '55440:5432'
  pg-replica:
    image: postgres:15-alpine
    container_name: gnl-failover-replica
    depends_on:
      - pg-primary
    user: postgres
    environment:
      # A subdirectory, not the volume ROOT: pg_basebackup creates it with 0700 → passes postgres's permission check.
      PGDATA: /var/lib/postgresql/data/pgdata
    # On first boot, take a base backup from the primary (-R: writes standby.signal + primary_conninfo),
    # then start as hot standby. Retries until the primary is ready if it isn't yet.
    command: >
      sh -c 'if [ ! -s "$$PGDATA/PG_VERSION" ]; then
               until pg_basebackup -h pg-primary -p 5432 -U gnl -D "$$PGDATA" -R -X stream; do
                 echo "primary bekleniyor..."; sleep 2;
               done;
             fi;
             chmod 700 "$$PGDATA";
             exec postgres -c hot_standby=on'
    ports:
      - '55441:5432'
